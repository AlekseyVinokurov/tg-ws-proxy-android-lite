name: Build Pixel 8 APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "app/**"
      - ".github/workflows/build-pixel8.yml"
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-pixel8.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Test Rust proxy from source
        run: |
          cargo test --locked --lib

      - name: Verify hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME}/cmdline-tools"
          echo "Using preinstalled GitHub-hosted Android SDK"

      - name: Compile the Android arm64 Rust core (never use stale bundled .so)
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'ndk;26.3.11579264'
          rustup target add aarch64-linux-android
          NDK="${ANDROID_HOME}/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64"
          test -x "$NDK/bin/aarch64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/bin/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$NDK/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK/bin/llvm-ar"
          cargo build --locked --release --target aarch64-linux-android
          so="target/aarch64-linux-android/release/libtgwsproxy.so"
          test -s "$so"
          symbols="$("$NDK/bin/llvm-nm" -D "$so")"
          grep -qE ' [TW] SetCfWs80Fallback$' <<< "$symbols"
          for name in StartProxy StopProxy SetCfProxyConfig GetStats FreeString; do
            grep -qE " [TW] ${name}$" <<< "$symbols"
          done
          cp "$so" app/src/main/jniLibs/arm64-v8a/libtgwsproxy.so

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build arm64 debug APK with newly compiled native library
        run: gradle :app:assembleArm64Debug --no-daemon

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          test -s "$APK"
          cp "$APK" "tg-ws-proxy-pixel8-eco.apk"

      - name: Upload test APK (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-pixel8-eco-${{ github.run_id }}
          path: tg-ws-proxy-pixel8-eco.apk
          if-no-files-found: error
          retention-days: 7
