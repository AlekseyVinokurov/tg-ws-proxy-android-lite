name: Build Pixel 8 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-pixel8.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native arm64 library
        shell: bash
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cargo ndk -t arm64-v8a --platform 24 -o app/src/main/jniLibs build --release
          test -f app/src/main/jniLibs/arm64-v8a/libtgwsproxy.so

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build Pixel 8 debug APK
        run: gradle :app:assembleArm64Debug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          test -f "$APK"
          cp "$APK" "tg-ws-proxy-pixel8-eco.apk"
          ls -lh "tg-ws-proxy-pixel8-eco.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-pixel8-eco
          path: tg-ws-proxy-pixel8-eco.apk
          if-no-files-found: error
